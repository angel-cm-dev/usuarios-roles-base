# nginx (imagen sin privilegios: escucha en 8080).
# - Sirve la SPA y hace fallback a index.html para las rutas de React Router.
# - Hace de proxy inverso de /api y /health hacia el backend: mismo origen => la cookie
#   del refresh token (SameSite=Strict, Path=/api/auth) funciona sin CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Nota: las cabeceras de seguridad se declaran por "location" porque add_header no se hereda
    # si la location define las suyas. /api no añade ninguna: las pone la propia API (evita duplicados).

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La API usa X-Forwarded-For para el rate limiting por IP y la auditoría.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    # Archivos con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # style-src 'unsafe-inline' es necesario para atributos style de React (no permite scripts inline).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
