name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore UsuariosRoles.sln

      - name: Formato (lint)
        run: dotnet format UsuariosRoles.sln --verify-no-changes --no-restore --severity error

      - name: Compilar
        run: dotnet build UsuariosRoles.sln --no-restore -c Release

      - name: Pruebas (unitarias + integración, sin Docker)
        run: dotnet test UsuariosRoles.sln --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Migraciones al día
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/UsuariosRoles.Infrastructure --startup-project src/UsuariosRoles.Infrastructure

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
